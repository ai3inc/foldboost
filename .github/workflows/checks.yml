name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q foldboost tests tools
      - run: python -m unittest discover -s tests -p 'test_*.py'
